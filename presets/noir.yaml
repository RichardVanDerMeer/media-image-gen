name: noir
description:
prompt:
  base: |
    Gritty psychological thriller illustration, 1980s paperback cover vibe,
    claustrophobic interior, subtle film-grain texture, sharp details,
    ominous mood, tension in the scene, realistic proportions, no stylization to cartoon
